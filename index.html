<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8" />
  <title>带绿色边框 + QRCode 翻页书页（1-100）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      background: #000;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 顶部控制条 */
    .control-bar {
      padding: 6px 10px;
      font-size: 13px;
      background: #111;
      color: #ccc;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    .control-bar input[type="number"] {
      width: 70px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #000;
      color: #eee;
    }
    .control-bar button {
      padding: 3px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      background: #3b82f6;
      color: #fff;
    }
    .control-bar button:active {
      transform: scale(0.96);
    }

    /* 中央书页区域 */
    .page-area {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .page {
      background: #fff;
      aspect-ratio: 210 / 297;  /* A4 纸比例 */
      width: min(80vw, 80vh * 210 / 297);

      /* ⭐绿色边框⭐ */
      border: 18px solid #00ff00;

      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      border-radius: 4px;

      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .page-inner {
      width: 100%;
      height: 100%;
      background: #fff;

      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* QR 码 */
    #qrcode {
      width: 30%;
      aspect-ratio: 1 / 1;
    }
    #qrcode img, #qrcode canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 页码 */
    .page-number-text {
      position: absolute;
      bottom: 10px;
      right: 16px;
      font-size: 12px;
      color: #555;
      user-select: none;
    }

    /* 底部翻页提示 */
    .hint { font-size: 11px; color: #888; margin-left: 6px; }
  </style>
</head>
<body>

  <!-- 顶部控制条 -->
  <div class="control-bar">
    <button id="prevBtn">上一页</button>
    <button id="nextBtn">下一页</button>
    <span>跳转到：</span>
    <input id="pageInput" type="number" min="1" max="100" value="1" />
    <button id="goBtn">GO</button>
    <span class="hint">可用 ← → 键翻页</span>
  </div>

  <!-- 中央书页 display -->
  <div class="page-area">
    <div class="page">
      <div class="page-inner">
        <div id="qrcode"></div>
        <div class="page-number-text" id="pageNumberLabel">Page 1</div>
      </div>
    </div>
  </div>

  <script>
    let currentPage = 1;

    const MAX_PAGE = 100;

    const pageInput = document.getElementById("pageInput");
    const pageNumberLabel = document.getElementById("pageNumberLabel");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const goBtn   = document.getElementById("goBtn");

    const qrContainer = document.getElementById("qrcode");

    // 初始化二维码
    let qr = new QRCode(qrContainer, {
      text: "1",
      width: 256,
      height: 256,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    /** 更新二维码 + 页码显示 */
    function updatePage(n) {
      if (n < 1 || n > MAX_PAGE) return;

      currentPage = n;

      qr.clear();
      qr.makeCode(String(n));

      pageInput.value = n;
      pageNumberLabel.textContent = "Page " + n;
    }

    // 上一页
    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) updatePage(currentPage - 1);
    });

    // 下一页
    nextBtn.addEventListener("click", () => {
      if (currentPage < MAX_PAGE) updatePage(currentPage + 1);
    });

    // 跳转
    goBtn.addEventListener("click", () => {
      const target = Number(pageInput.value);
      if (target >= 1 && target <= MAX_PAGE) {
        updatePage(target);
      }
    });

    // 回车跳转
    pageInput.addEventListener("keydown", e => {
      if (e.key === "Enter") goBtn.click();
    });

    // 键盘左右键翻页
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") {
        if (currentPage > 1) updatePage(currentPage - 1);
      } else if (e.key === "ArrowRight") {
        if (currentPage < MAX_PAGE) updatePage(currentPage + 1);
      }
    });

    // 初始渲染
    updatePage(1);
  </script>

</body>
</html>
